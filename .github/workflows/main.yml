name: run-tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        name: PHP 8.4 - Laravel 12 - PostgreSQL 16

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: risetools_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            RISETOOLS_TEST_PGSQL: '1'
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_DATABASE: risetools_test
            DB_USERNAME: postgres
            DB_PASSWORD: postgres

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, curl, mbstring, intl, gd, pdo, pdo_sqlite, sqlite3, pdo_pgsql, openssl, fileinfo
                  coverage: none

            # pg_dump/psql na mesma versão do servidor (os testes de snapshot usam).
            - name: Install PostgreSQL client
              run: |
                  sudo apt-get update
                  sudo apt-get install -y postgresql-client-16
                  echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ hashFiles('composer.json') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Execute tests
              run: vendor/bin/phpunit

            # badssl.com: depende de rede externa, não bloqueia o build.
            - name: Execute network tests
              continue-on-error: true
              run: vendor/bin/phpunit --group network
